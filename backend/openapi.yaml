components:
  schemas:
    Branding:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 180
        logo_url:
          type: string
          format: uri
          readOnly: true
        favicon_url:
          type: string
          format: uri
          maxLength: 200
        primary_color:
          type: string
          maxLength: 7
        accent_color:
          type: string
          maxLength: 7
        receipt_header:
          type: string
          maxLength: 220
        receipt_footer:
          type: string
        terminology: {}
        document_prefixes: {}
      required:
      - display_name
      - logo_url
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - updated_at
    CompanyLogo:
      type: object
      properties:
        logo:
          type: string
          format: uri
      required:
      - logo
    CustomField:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        module_code:
          type: string
          maxLength: 50
        entity_type:
          type: string
          maxLength: 50
        key:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          maxLength: 120
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        required:
          type: boolean
        options: {}
        validation: {}
        is_active:
          type: boolean
      required:
      - entity_type
      - field_type
      - id
      - key
      - label
      - module_code
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 180
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        custom_data: {}
        is_active:
          type: boolean
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance
      - created_at
      - id
      - name
      - updated_at
    Expense:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 180
        category:
          type: string
          maxLength: 100
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        currency:
          type: string
          readOnly: true
        incurred_at:
          type: string
          format: date-time
        payment_method:
