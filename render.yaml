services:
  - type: web
    name: workcrest-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements/base.txt && python manage.py collectstatic --noinput
    startCommand: bash render_start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "false"
      - key: PLATFORM_NAME
        value: Workcrest
      - key: SINGLE_HOST_TENANCY
        value: "true"
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "false"
      - key: MEDIA_STORAGE_BACKEND
        value: s3
      - key: DJANGO_SUPERUSER_EMAIL
        value: pelumialiu8@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FULL_NAME
        value: Workcrest Owner
      - key: WEB_CONCURRENCY
        value: "2"
